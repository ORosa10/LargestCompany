name: Daily report

on:
  # Runs only when Polymarket prices are updated (a push to daily_inputs.json),
  # or on manual dispatch. No blind daily cron - no prices, no report.
  workflow_dispatch: {}
  push:
    paths:
      - "daily_inputs.json"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily report
        run: python daily_report.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Daily report $(date -u +%Y-%m-%d)"
            git push
          fi
